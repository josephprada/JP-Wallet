name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  WEB_DIST: apps/web/dist
  VPS_WEB_ROOT: /var/www/jp-wallet

jobs:
  deploy:
    name: Convex + Build + VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex (production)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy -y

      - name: Build frontend
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL_PROD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: bun run build

      - name: Verify build output
        run: test -f "${{ env.WEB_DIST }}/index.html"

      - name: Backup current release on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ -d "${{ env.VPS_WEB_ROOT }}" ] && [ "$(ls -A ${{ env.VPS_WEB_ROOT }} 2>/dev/null)" ]; then
              sudo rm -rf ${{ env.VPS_WEB_ROOT }}.prev
              sudo cp -a ${{ env.VPS_WEB_ROOT }} ${{ env.VPS_WEB_ROOT }}.prev
            fi

      - name: Clean web root on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            sudo rm -rf ${{ env.VPS_WEB_ROOT }}/*

      - name: Sync static files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "${{ env.WEB_DIST }}/*"
          target: "${{ env.VPS_WEB_ROOT }}"
          strip_components: 3
          overwrite: true

      - name: Fix permissions and reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            sudo chown -R nginx:nginx ${{ env.VPS_WEB_ROOT }}
            sudo nginx -t
            sudo systemctl reload nginx
            echo "Deploy OK: https://wallet.lavalex.co"

      - name: Derive Convex Site URL for MCP
        id: convex_site
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL_PROD }}
        run: |
          set -euo pipefail
          cloud="${VITE_CONVEX_URL%/}"
          if [[ "$cloud" == *.convex.cloud ]]; then
            site="${cloud%.convex.cloud}.convex.site"
          elif [[ "$cloud" == *.cloud ]]; then
            site="${cloud%.cloud}.site"
          else
            echo "Unexpected VITE_CONVEX_URL_PROD shape" >&2
            exit 1
          fi
          echo "site_url=$site" >> "$GITHUB_OUTPUT"
          echo "MCP CONVEX_SITE_URL derived (cloud→site)"

      # Requiere bootstrap root previo (scripts/vps-bootstrap-mcp-root.sh).
      # continue-on-error: no bloquea el deploy web si MCP aún no está bootstrapeado.
      - name: Sync MCP server to VPS
        continue-on-error: true
        id: mcp_sync
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Staging propiedad del usuario deploy: /opt/jp-wallet/mcp-server es de
          # jpwallet (ACL rwX para deploy), y tar no puede hacer chmod/utime allí.
          source: "apps/mcp-server/src,apps/mcp-server/package.json,apps/mcp-server/tsconfig.json"
          target: "/tmp/jp-wallet-mcp-release"
          strip_components: 2
          rm: true

      - name: Restart MCP on VPS
        continue-on-error: true
        if: steps.mcp_sync.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            STAGING=/tmp/jp-wallet-mcp-release
            MCP_ROOT=/opt/jp-wallet/mcp-server
            # Copia solo contenido (sin chmod/chown/utime): lo que permite la ACL de deploy.
            cd "$STAGING"
            find . -type d -exec mkdir -p "$MCP_ROOT/{}" \;
            find . -type f -exec sh -c 'cat "$1" > "$2/$1"' _ {} "$MCP_ROOT" \;
            cd "$MCP_ROOT"
            bun install 2>/dev/null || true
            sudo systemctl restart jp-wallet-mcp
            # Bun tarda unos segundos en abrir el puerto tras el restart.
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3100/healthz; then
                echo
                echo "MCP restart OK"
                exit 0
              fi
              sleep 2
            done
            systemctl status jp-wallet-mcp --no-pager -l || true
            exit 1
