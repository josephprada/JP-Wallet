# mcp.wallet.lavalex.co — JP-WALLET MCP server (proxy TLS → Bun :3100)
# Instalar en: /etc/nginx/conf.d/mcp.wallet.lavalex.co.conf
# Requiere DNS A mcp.wallet.lavalex.co → 69.6.234.237 y certificado (Certbot).

server {
	listen 80;
	listen [::]:80;
	server_name mcp.wallet.lavalex.co;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name mcp.wallet.lavalex.co;

	# Tras certbot --nginx -d mcp.wallet.lavalex.co estas rutas se actualizan.
	# Fallback inicial: cert compartido lavalex.co (válido solo si el SAN incluye el host).
	ssl_certificate /etc/letsencrypt/live/lavalex.co/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/lavalex.co/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	location /healthz {
		proxy_pass http://127.0.0.1:3100/healthz;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	location /mcp {
		proxy_pass http://127.0.0.1:3100/mcp;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Authorization $http_authorization;
		proxy_buffering off;
		proxy_read_timeout 300s;
	}

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
