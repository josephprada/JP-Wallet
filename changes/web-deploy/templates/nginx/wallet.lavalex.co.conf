# wallet.lavalex.co — JP-WALLET (SPA estática)
# Instalar en: /etc/nginx/conf.d/wallet.lavalex.co.conf
# NO modificar lavalex.conf ni jarvis.lavalex.co.conf

server {
    listen 80;
    listen [::]:80;
    server_name wallet.lavalex.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wallet.lavalex.co;

    root /var/www/jp-wallet;
    index index.html;

    # SPA — React Router client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker / PWA entry — NEVER immutable (must see new deploys)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets con hash — cache largo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — no cache agresivo (nuevos deploys)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    ssl_certificate /etc/letsencrypt/live/lavalex.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lavalex.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # OAuth popup (Google): mantiene window.opener tras navegación cross-origin
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # CSP borrador — allowlist Convex + Google OAuth + fonts. Ajustar en staging antes de endurecer.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src 'self' https://*.convex.cloud https://*.convex.site wss://*.convex.cloud https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self' blob:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
